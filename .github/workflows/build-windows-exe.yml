name: Windows EXE 빌드

# 이 브랜치에 푸시될 때 자동으로 Windows .exe 를 빌드한다.
# (PyInstaller 는 크로스 컴파일을 지원하지 않으므로 Windows 러너에서 빌드해야 한다.)
# 수동 실행(workflow_dispatch)도 가능하다.
on:
  push:
    branches:
      - claude/loving-babbage-3e0icr
    paths:
      - "filerenew/**"
      - "run_gui.py"
      - "build.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 테스트 실행
        run: python -m unittest discover -s tests -v

      - name: EXE 빌드 (PyInstaller)
        run: pyinstaller build.spec --noconfirm --clean

      - name: 산출물 확인
        shell: pwsh
        run: Get-ChildItem dist

      - name: EXE 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: FileRenew-windows-exe
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
